name: PR Review Bot

# Trigger on PR events
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Run PR Review
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for diff generation

      # 2️⃣ Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Install required packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub openai

      # 4️⃣ Generate diff.txt against the PR base branch
      - name: Generate diff
        shell: bash
        run: |
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$TARGET_BRANCH"
          git diff origin/"$TARGET_BRANCH"...HEAD > diff.txt || echo "No changes detected"

      # 5️⃣ Run the Python PR review script
      - name: Run PR review script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python ci_script.py
