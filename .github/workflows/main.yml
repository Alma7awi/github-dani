name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    name: Run PR Review

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub openai

      # Generate diff file
      - name: Generate diff
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          git fetch origin "$TARGET_BRANCH"
          git diff origin/"$TARGET_BRANCH"...HEAD > diff.txt || echo "No changes"

      # Run PR review script
      - name: Run PR review script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_PROXY_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_PROXY_BASE }}
        run: |
          python ci_script.py
