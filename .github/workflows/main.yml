name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Run PR Review
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full history to generate diffs

      # Setup Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Install required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub azure-identity azure-ai-openai

      # Generate diff against the target branch
      - name: Generate diff
        shell: bash
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          git fetch origin "$TARGET_BRANCH"
          git diff origin/"$TARGET_BRANCH"...HEAD > diff.txt || echo "No changes to diff"

      # Run the async PR review script
      - name: Run PR review script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
        run: python ci_script.py
